services:
  api:
    build: .
    env_file: .env
    restart: unless-stopped
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ducluster
      POSTGRES_USER: ducluster
      POSTGRES_PASSWORD: change-me-in-secret-manager
    volumes: [ducluster_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
volumes:
  ducluster_pg:
